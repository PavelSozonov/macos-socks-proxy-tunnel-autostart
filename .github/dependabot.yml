---
version: 2
updates:
  # One grouped PR for version updates and one for security updates: a
  # group without applies-to covers version updates only, so every security
  # alert would otherwise open its own PR. The PR limit is explicit; the
  # default is five open version-update PRs.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"
      security:
        applies-to: security-updates
        patterns:
          - "*"

  # Hook revisions in .pre-commit-config.yaml: without an entry they are
  # only updated by hand.
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels:
      - dependencies
      - pre-commit
    groups:
      pre-commit:
        patterns:
          - "*"
