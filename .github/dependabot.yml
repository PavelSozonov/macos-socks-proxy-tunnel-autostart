---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"

  # Hook revisions in .pre-commit-config.yaml: without an entry they are
  # only updated by hand.
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels:
      - dependencies
      - pre-commit
    groups:
      pre-commit:
        patterns:
          - "*"
