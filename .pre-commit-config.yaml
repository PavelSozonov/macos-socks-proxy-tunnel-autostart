---
# Basic hygiene and shell linting. CI runs exactly this
# (.github/workflows/ci.yml: `pre-commit run --all-files`), so keep the two in sync.
# Versions are pinned; bump them deliberately.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # Two trailing spaces are a line break in Markdown, not noise.
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-executables-have-shebangs
      - id: check-added-large-files
      - id: detect-private-key

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Network calls and CI jobs without a time limit (curl, ssh/rsync, docker
  # pull, git clone, jobs without timeout-minutes). Warnings only: the commit
  # is not stopped, verbose shows them on success too. Exception: a comment
  # "# timeout-ok: <reason>" on the call.
  - repo: local
    hooks:
      - id: check-timeouts
        name: timeouts (warnings)
        entry: python3 scripts/check-timeouts.py
        language: python
        additional_dependencies: ["pyyaml==6.0.3"]
        types_or: [python, shell, yaml, dockerfile]
        verbose: true
